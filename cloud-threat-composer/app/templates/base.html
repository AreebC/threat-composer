<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cloud Threat Composer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">TC</span> Cloud Threat Composer</a>
    <span class="subtitle">STRIDE-based cloud risk modelling</span>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>
